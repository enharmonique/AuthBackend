# Server Configuration
server.port=8443

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:androidsecuritydb
#spring.datasource.url=jdbc:h2:file:./data/androidsecuritydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework=INFO
logging.level.com.example.androidsecurityapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show SQL in Console
spring.jpa.show-sql=true

# H2 Console (for testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SSL Configuration
server.ssl.key-store=classpath:keystore/springboot.p12
server.ssl.key-store-password=android8
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot